[Unit]
Description=DevOps Challenge Web Application
After=network.target

[Service]
User=ubuntu
WorkingDirectory=/opt/devops-app
Environment="APP_NAME=Devops Challenge App"
Environment="APP_PORT=5000"
ExecStart=/opt/devops-app/venv/bin/python app.py
Restart=always

[Install]
WantedBy=multi-user.target
